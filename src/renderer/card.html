<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: transparent;
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif; }

  /* The bubble: one black rounded card + a tail aimed at the pointed ring. */
  #bubble { position: absolute; inset: 0; }
  #card { position: absolute; left: 0; right: 0; top: 0;
    background: rgba(22,22,24,0.97); border-radius: 18px;
    box-shadow: 0 8px 28px rgba(0,0,0,0.5), inset 0 0 0 0.5px rgba(255,255,255,0.10);
    padding: 15px 16px 13px; color: #fff; overflow: hidden; }
  #tail { position: absolute; width: 14px; height: 14px; background: rgba(22,22,24,0.97);
    transform: rotate(45deg); }
  #tail.right { right: -6px; border-radius: 0 4px 0 0; }
  #tail.left { left: -6px; border-radius: 4px 0 0 0; }
  #tail.top { top: -6px; border-radius: 4px 0 0 0; }
  #tail.bottom { bottom: -6px; border-radius: 0 0 4px 0; }

  .head { display: flex; align-items: center; gap: 9px; margin-bottom: 3px; }
  .head .icon { width: 20px; height: 20px; color: rgba(255,255,255,0.92); flex: none; }
  .head .icon svg { width: 20px; height: 20px; }
  .head .icon svg * { fill: currentColor; }
  .head .title { font-size: 15px; font-weight: 650; letter-spacing: -0.1px; }
  .head .plan { margin-left: auto; font-size: 12px; color: rgba(255,255,255,0.55); font-weight: 500; }
  .updated { font-size: 11.5px; color: rgba(255,255,255,0.42); margin: 0 0 11px 29px; }

  .limit { margin-top: 11px; }
  .limit .name { font-size: 13px; color: rgba(255,255,255,0.92); margin-bottom: 6px;
    display: flex; justify-content: space-between; align-items: baseline; }
  .limit .name .scope { color: rgba(255,255,255,0.45); font-size: 12px; margin-left: 6px; }
  .bar { height: 6px; border-radius: 3px; background: #3a3a3c; overflow: hidden; }
  .bar .fill { height: 100%; border-radius: 3px; }
  .row { display: flex; justify-content: space-between; align-items: baseline; margin-top: 6px; }
  .row .used { font-size: 13px; font-weight: 650; }
  .row .reset { font-size: 12px; color: rgba(255,255,255,0.42); }
  .est { font-size: 11.5px; color: rgba(255,255,255,0.40); margin-top: 2px; }

  .balance-row { display: flex; justify-content: space-between; align-items: baseline; margin-top: 12px;
    padding-top: 10px; border-top: 0.5px solid rgba(255,255,255,0.10); }
  .balance-row .k { font-size: 13px; color: rgba(255,255,255,0.6); }
  .balance-row .v { font-size: 14px; font-weight: 650; }

  .foot { margin-top: 12px; font-size: 11.5px; color: rgba(255,255,255,0.38); }
  .reason { font-size: 13px; color: rgba(255,255,255,0.75); margin: 10px 0 4px; }
  .cta { font-size: 12px; color: #0a84ff; cursor: pointer; margin-top: 8px; }
  .cta:hover { text-decoration: underline; }

  /* Local ledger ("本机用量"): history read off this machine's own records. */
  .ledger { margin-top: 14px; padding-top: 11px; border-top: 1px solid rgba(255,255,255,0.12); }
  .ledger .ltitle { font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.5); margin-bottom: 9px; }
  .lfigs { display: flex; gap: 22px; margin-bottom: 4px; }
  .lfig .lk { font-size: 12px; color: rgba(255,255,255,0.45); }
  .lfig .lv { font-size: 18px; font-weight: 650; letter-spacing: -0.3px; }
  .lfig .lc { font-size: 11.5px; color: rgba(255,255,255,0.42); }
  .lbars { display: flex; align-items: flex-end; gap: 2px; height: 26px; margin: 8px 0 10px; }
  .lbars i { flex: 1; min-width: 2px; border-radius: 1.5px; background: rgba(255,255,255,0.30); }
  .lbars i.on { background: rgba(255,255,255,0.85); }
  .lbars i.zero { height: 2px !important; opacity: 0.35; }
  .lrow { display: flex; justify-content: space-between; align-items: baseline; margin-top: 7px;
    font-size: 12px; color: rgba(255,255,255,0.45); }
  .lrow .rv { color: rgba(255,255,255,0.92); font-weight: 600; }
  .lnote { margin-top: 10px; font-size: 11px; color: rgba(255,255,255,0.36); }
</style>
</head>
<body>
  <div id="bubble">
    <div id="card">
      <div class="head">
        <div class="icon" id="hicon"></div>
        <div class="title" id="htitle"></div>
        <div class="plan" id="hplan"></div>
      </div>
      <div class="updated" id="hupdated"></div>
      <div id="rows"></div>
      <div class="foot" id="hfoot"></div>
    </div>
    <div id="tail"></div>
  </div>
  <script src="../shared/usage.js"></script>
  <script src="../shared/i18n.js"></script>
  <script src="card.js"></script>
</body>
</html>
